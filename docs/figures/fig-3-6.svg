<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="2240" viewBox="0 0 2100 2240" font-family="'Times New Roman', Times, serif" font-size="30"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#111"/></marker><marker id="o" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L14,8 L2,14" fill="none" stroke="#111" stroke-width="2"/></marker></defs><rect width="2100" height="2240" fill="#fff"/><rect x="890" y="12" width="220" height="76" rx="38" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1000.0" y="60.5" text-anchor="middle" font-size="30" fill="#111">Start</text><path d="M1000,88 L1000,155" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><polygon points="1000,155.0 1260.0,230 1000,305.0 740.0,230" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1000" y="222.0" text-anchor="middle" font-size="29" fill="#111">Booking</text><text x="1000" y="258.3" text-anchor="middle" font-size="29" fill="#111">channel?</text><path d="M740,230 L330,230 L330,370" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><text x="540" y="204.4" text-anchor="middle" font-size="27" fill="#111">Messenger bot</text><path d="M1000,305 L1000,370" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><text x="1070" y="349.4" text-anchor="middle" font-size="27" fill="#111">online form</text><path d="M1260,230 L1750,230 L1750,370" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><text x="1500" y="182.6" text-anchor="middle" font-size="27" fill="#111">phone, chat,</text><text x="1500" y="216.3" text-anchor="middle" font-size="27" fill="#111">or walk-in</text><rect x="90.0" y="370.0" width="480" height="120" rx="0" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="330.0" y="422.0" text-anchor="middle" font-size="29" fill="#111">Patient chats with the</text><text x="330.0" y="458.3" text-anchor="middle" font-size="29" fill="#111">Messenger booking bot</text><path d="M330,490 L330,540" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><rect x="90.0" y="540.0" width="480" height="140" rx="0" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="330.0" y="583.9" text-anchor="middle" font-size="29" fill="#111">Bot collects the choices and</text><text x="330.0" y="620.1" text-anchor="middle" font-size="29" fill="#111">sends a signed link</text><text x="330.0" y="656.4" text-anchor="middle" font-size="29" fill="#111">(valid 2 hours, one use)</text><path d="M570,610 L660,610 L660,430 L750,430" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><text x="700" y="513.1" text-anchor="start" font-size="25" fill="#111">channel:</text><text x="700" y="544.4" text-anchor="start" font-size="25" fill="#111">chat</text><rect x="750.0" y="370.0" width="500" height="120" rx="0" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1000.0" y="422.0" text-anchor="middle" font-size="29" fill="#111">Patient fills in the</text><text x="1000.0" y="458.3" text-anchor="middle" font-size="29" fill="#111">online request form</text><path d="M1000,490 L1000,565" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><polygon points="1000,565.0 1220.0,640 1000,715.0 780.0,640" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1000" y="632.0" text-anchor="middle" font-size="29" fill="#111">Booking</text><text x="1000" y="668.3" text-anchor="middle" font-size="29" fill="#111">valid?</text><path d="M1220,640 L1300,640 L1300,430 L1250,430" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><text x="1330" y="552.9" text-anchor="start" font-size="26" fill="#111">no: show</text><text x="1330" y="585.4" text-anchor="start" font-size="26" fill="#111">the error</text><path d="M1000,715 L1000,770" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><text x="1030" y="754.1" text-anchor="start" font-size="26" fill="#111">yes</text><rect x="720.0" y="770.0" width="560" height="120" rx="0" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1000.0" y="822.0" text-anchor="middle" font-size="29" fill="#111">Match the patient by contact number</text><text x="1000.0" y="858.3" text-anchor="middle" font-size="29" fill="#111">or create a new record</text><path d="M1000,890 L1000,920" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><rect x="720.0" y="920.0" width="560" height="120" rx="0" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1000.0" y="972.0" text-anchor="middle" font-size="29" fill="#111">Save the appointment</text><text x="1000.0" y="1008.3" text-anchor="middle" font-size="29" fill="#111">with the status pending</text><path d="M1000,1040 L1000,1085" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><polygon points="1000,1085.0 1220.0,1160 1000,1235.0 780.0,1160" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1000" y="1152.0" text-anchor="middle" font-size="29" fill="#111">Staff confirm</text><text x="1000" y="1188.3" text-anchor="middle" font-size="29" fill="#111">the request?</text><path d="M780,1160 L610,1160" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><text x="695" y="1139.1" text-anchor="middle" font-size="26" fill="#111">no</text><rect x="190.0" y="1095.0" width="420" height="130" rx="0" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="400.0" y="1152.0" text-anchor="middle" font-size="29" fill="#111">Set the status to declined</text><text x="400.0" y="1188.3" text-anchor="middle" font-size="29" fill="#111">and tell the patient</text><path d="M1000,1235 L1000,1305" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><text x="1030" y="1279.1" text-anchor="start" font-size="26" fill="#111">yes</text><polygon points="1000,1305.0 1220.0,1380 1000,1455.0 780.0,1380" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1000" y="1372.0" text-anchor="middle" font-size="29" fill="#111">Booking</text><text x="1000" y="1408.3" text-anchor="middle" font-size="29" fill="#111">still valid?</text><path d="M1220,1380 L1340,1380 L1340,1160 L1220,1160" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><text x="1370" y="1262.8" text-anchor="start" font-size="26" fill="#111">no: choose</text><text x="1370" y="1295.3" text-anchor="start" font-size="26" fill="#111">another slot</text><path d="M1000,1455 L1000,1525" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><text x="1030" y="1499.1" text-anchor="start" font-size="26" fill="#111">yes</text><rect x="640.0" y="1525.0" width="720" height="130" rx="0" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1000.0" y="1582.0" text-anchor="middle" font-size="29" fill="#111">Set the status to scheduled and send the</text><text x="1000.0" y="1618.3" text-anchor="middle" font-size="29" fill="#111">confirmation by email and Messenger</text><rect x="1530.0" y="370.0" width="440" height="120" rx="0" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1750.0" y="422.0" text-anchor="middle" font-size="29" fill="#111">Staff encode the</text><text x="1750.0" y="458.3" text-anchor="middle" font-size="29" fill="#111">booking and its channel</text><path d="M1750,490 L1750,565" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><polygon points="1750,565.0 1950.0,640 1750,715.0 1550.0,640" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1750" y="632.0" text-anchor="middle" font-size="29" fill="#111">Booking</text><text x="1750" y="668.3" text-anchor="middle" font-size="29" fill="#111">valid?</text><path d="M1950,640 L2040,640 L2040,430 L1970,430" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><text x="1990" y="692.9" text-anchor="end" font-size="26" fill="#111">no: show</text><text x="1990" y="725.4" text-anchor="end" font-size="26" fill="#111">the error</text><path d="M1750,715 L1750,770" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><text x="1780" y="754.1" text-anchor="start" font-size="26" fill="#111">yes</text><rect x="1530.0" y="770.0" width="440" height="120" rx="0" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1750.0" y="822.0" text-anchor="middle" font-size="29" fill="#111">Find the patient record</text><text x="1750.0" y="858.3" text-anchor="middle" font-size="29" fill="#111">or create a new one</text><path d="M1750,890 L1750,920" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><rect x="1530.0" y="920.0" width="440" height="120" rx="0" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1750.0" y="972.0" text-anchor="middle" font-size="29" fill="#111">Save the appointment</text><text x="1750.0" y="1008.3" text-anchor="middle" font-size="29" fill="#111">with the status scheduled</text><path d="M1750,1040 L1750,1700 L1000,1700" fill="none" stroke="#111" stroke-width="2.5"/><path d="M1000,1655 L1000,1740" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><rect x="550.0" y="1740.0" width="900" height="120" rx="0" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1000.0" y="1792.0" text-anchor="middle" font-size="29" fill="#111">The scheduled job sends the reminder the day before</text><text x="1000.0" y="1828.3" text-anchor="middle" font-size="29" fill="#111">the appointment (email, and Messenger when linked)</text><path d="M1000,1860 L1000,1930" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><rect x="550.0" y="1930.0" width="900" height="120" rx="0" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1000.0" y="1982.0" text-anchor="middle" font-size="29" fill="#111">Staff set the final status: attended,</text><text x="1000.0" y="2018.3" text-anchor="middle" font-size="29" fill="#111">cancelled (patient notified), or no-show</text><path d="M1000,2050 L1000,2110" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/><rect x="890" y="2112" width="220" height="76" rx="38" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="1000.0" y="2160.5" text-anchor="middle" font-size="30" fill="#111">End</text><path d="M400,1225 L400,2150 L890,2150" fill="none" stroke="#111" stroke-width="2.5" marker-end="url(#a)"/></svg>