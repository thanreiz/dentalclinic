<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="2700" viewBox="0 0 2500 2700" font-family="'Times New Roman', Times, serif"><defs><marker id="a" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L18,9 L0,18 z" fill="#111"/></marker></defs><rect width="2500" height="2700" fill="#fff"/><rect x="1020.0" y="40" width="260" height="90" rx="45.0" fill="#fff" stroke="#111" stroke-width="3"/><text x="1150" y="100.0" text-anchor="middle" font-size="44" fill="#111">Start</text><path d="M1150,130 L1150,190" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><path d="M1150,190 L1430.0,290.0 L1150,390 L870.0,290.0 Z" fill="#fff" stroke="#111" stroke-width="3"/><text x="1150" y="278.0" text-anchor="middle" font-size="44" fill="#111">Booking</text><text x="1150" y="332.0" text-anchor="middle" font-size="44" fill="#111">channel?</text><path d="M870,290 L400,290 L400,480" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><text x="640" y="265" text-anchor="middle" font-size="44" fill="#111">Messenger bot</text><path d="M1150,390 L1150,480" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><text x="1170" y="445" text-anchor="start" font-size="44" fill="#111">online form</text><path d="M1430,290 L2080,290 L2080,480" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><text x="1800" y="205" text-anchor="middle" font-size="44" fill="#111">phone, chat,</text><text x="1800" y="253" text-anchor="middle" font-size="44" fill="#111">or walk-in</text><rect x="100.0" y="480" width="600" height="120" fill="#fff" stroke="#111" stroke-width="3"/><text x="400" y="528.0" text-anchor="middle" font-size="44" fill="#111">Patient chats with the</text><text x="400" y="582.0" text-anchor="middle" font-size="44" fill="#111">Messenger booking bot</text><path d="M400,600 L400,660" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><rect x="100.0" y="660" width="600" height="170" fill="#fff" stroke="#111" stroke-width="3"/><text x="400" y="706.0" text-anchor="middle" font-size="44" fill="#111">Bot collects the choices and</text><text x="400" y="760.0" text-anchor="middle" font-size="44" fill="#111">sends a signed link</text><text x="400" y="814.0" text-anchor="middle" font-size="44" fill="#111">(valid 2 hours, one use)</text><path d="M700,745 L730,745 L730,540 L770,540" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><text x="745" y="652" text-anchor="start" font-size="44" fill="#111">channel: chat</text><rect x="770.0" y="480" width="760" height="120" fill="#fff" stroke="#111" stroke-width="3"/><text x="1150" y="528.0" text-anchor="middle" font-size="44" fill="#111">Patient fills in the</text><text x="1150" y="582.0" text-anchor="middle" font-size="44" fill="#111">online request form</text><path d="M1150,600 L1150,680" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><path d="M1150,680 L1410.0,780.0 L1150,880 L890.0,780.0 Z" fill="#fff" stroke="#111" stroke-width="3"/><text x="1150" y="768.0" text-anchor="middle" font-size="44" fill="#111">Booking</text><text x="1150" y="822.0" text-anchor="middle" font-size="44" fill="#111">valid?</text><path d="M1410,780 L1620,780 L1620,540 L1530,540" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><text x="1635" y="700" text-anchor="start" font-size="44" fill="#111">no: show</text><text x="1635" y="748" text-anchor="start" font-size="44" fill="#111">the error</text><path d="M1150,880 L1150,960" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><text x="1170" y="930" text-anchor="start" font-size="44" fill="#111">yes</text><rect x="770.0" y="960" width="760" height="120" fill="#fff" stroke="#111" stroke-width="3"/><text x="1150" y="1008.0" text-anchor="middle" font-size="44" fill="#111">Match the patient by contact number</text><text x="1150" y="1062.0" text-anchor="middle" font-size="44" fill="#111">or create a new record</text><path d="M1150,1080 L1150,1150" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><rect x="770.0" y="1150" width="760" height="120" fill="#fff" stroke="#111" stroke-width="3"/><text x="1150" y="1198.0" text-anchor="middle" font-size="44" fill="#111">Save the appointment</text><text x="1150" y="1252.0" text-anchor="middle" font-size="44" fill="#111">with the status pending</text><path d="M1150,1270 L1150,1340" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><path d="M1150,1340 L1430.0,1440.0 L1150,1540 L870.0,1440.0 Z" fill="#fff" stroke="#111" stroke-width="3"/><text x="1150" y="1428.0" text-anchor="middle" font-size="44" fill="#111">Staff confirm</text><text x="1150" y="1482.0" text-anchor="middle" font-size="44" fill="#111">the request?</text><rect x="100.0" y="1380" width="600" height="120" fill="#fff" stroke="#111" stroke-width="3"/><text x="400" y="1428.0" text-anchor="middle" font-size="44" fill="#111">Set the status to declined</text><text x="400" y="1482.0" text-anchor="middle" font-size="44" fill="#111">and tell the patient</text><path d="M870,1440 L700,1440" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><text x="790" y="1415" text-anchor="middle" font-size="44" fill="#111">no</text><path d="M400,1500 L400,2575 L1020,2575" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><path d="M1150,1540 L1150,1620" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><text x="1170" y="1590" text-anchor="start" font-size="44" fill="#111">yes</text><path d="M1150,1620 L1410.0,1720.0 L1150,1820 L890.0,1720.0 Z" fill="#fff" stroke="#111" stroke-width="3"/><text x="1150" y="1708.0" text-anchor="middle" font-size="44" fill="#111">Booking</text><text x="1150" y="1762.0" text-anchor="middle" font-size="44" fill="#111">still valid?</text><path d="M1410,1720 L1640,1720 L1640,1440 L1430,1440" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><text x="1655" y="1590" text-anchor="start" font-size="44" fill="#111">no: choose</text><text x="1655" y="1638" text-anchor="start" font-size="44" fill="#111">another slot</text><path d="M1150,1820 L1150,1900" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><text x="1170" y="1870" text-anchor="start" font-size="44" fill="#111">yes</text><rect x="710.0" y="1900" width="880" height="120" fill="#fff" stroke="#111" stroke-width="3"/><text x="1150" y="1948.0" text-anchor="middle" font-size="44" fill="#111">Set the status to scheduled and send the</text><text x="1150" y="2002.0" text-anchor="middle" font-size="44" fill="#111">confirmation by email and Messenger</text><path d="M1150,2020 L1150,2150" fill="none" stroke="#111" stroke-width="3"/><rect x="1800.0" y="480" width="560" height="120" fill="#fff" stroke="#111" stroke-width="3"/><text x="2080" y="528.0" text-anchor="middle" font-size="44" fill="#111">Staff encode the</text><text x="2080" y="582.0" text-anchor="middle" font-size="44" fill="#111">booking and its channel</text><path d="M2080,600 L2080,680" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><path d="M2080,680 L2340.0,780.0 L2080,880 L1820.0,780.0 Z" fill="#fff" stroke="#111" stroke-width="3"/><text x="2080" y="768.0" text-anchor="middle" font-size="44" fill="#111">Booking</text><text x="2080" y="822.0" text-anchor="middle" font-size="44" fill="#111">valid?</text><path d="M2340,780 L2430,780 L2430,540 L2360,540" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><text x="2440" y="868" text-anchor="end" font-size="44" fill="#111">no: show</text><text x="2440" y="916" text-anchor="end" font-size="44" fill="#111">the error</text><path d="M2080,880 L2080,960" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><text x="2100" y="930" text-anchor="start" font-size="44" fill="#111">yes</text><rect x="1800.0" y="960" width="560" height="120" fill="#fff" stroke="#111" stroke-width="3"/><text x="2080" y="1008.0" text-anchor="middle" font-size="44" fill="#111">Find the patient record</text><text x="2080" y="1062.0" text-anchor="middle" font-size="44" fill="#111">or create a new one</text><path d="M2080,1080 L2080,1150" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><rect x="1800.0" y="1150" width="560" height="120" fill="#fff" stroke="#111" stroke-width="3"/><text x="2080" y="1198.0" text-anchor="middle" font-size="44" fill="#111">Save the appointment</text><text x="2080" y="1252.0" text-anchor="middle" font-size="44" fill="#111">with the status scheduled</text><path d="M2080,1270 L2080,2090 L1150,2090" fill="none" stroke="#111" stroke-width="3"/><path d="M1150,2090 L1150,2150" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><rect x="590.0" y="2150" width="1120" height="120" fill="#fff" stroke="#111" stroke-width="3"/><text x="1150" y="2198.0" text-anchor="middle" font-size="44" fill="#111">The scheduled job sends the reminder the day before</text><text x="1150" y="2252.0" text-anchor="middle" font-size="44" fill="#111">the appointment (email, and Messenger when linked)</text><path d="M1150,2270 L1150,2340" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><rect x="590.0" y="2340" width="1120" height="120" fill="#fff" stroke="#111" stroke-width="3"/><text x="1150" y="2388.0" text-anchor="middle" font-size="44" fill="#111">Staff set the final status: attended,</text><text x="1150" y="2442.0" text-anchor="middle" font-size="44" fill="#111">cancelled (patient notified), or no-show</text><path d="M1150,2460 L1150,2530" fill="none" stroke="#111" stroke-width="3" marker-end="url(#a)"/><rect x="1020.0" y="2530" width="260" height="90" rx="45.0" fill="#fff" stroke="#111" stroke-width="3"/><text x="1150" y="2590.0" text-anchor="middle" font-size="44" fill="#111">End</text></svg>